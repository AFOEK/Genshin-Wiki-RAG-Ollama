name: rag

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip

  # --------------------------------------------------------------------------
  # Core scientific stack
  # --------------------------------------------------------------------------
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - lightgbm

  # --------------------------------------------------------------------------
  # PyTorch
  # --------------------------------------------------------------------------
  - pytorch=2.10.*=*cpu*

  # --------------------------------------------------------------------------
  # FAISS
  # --------------------------------------------------------------------------
  - faiss=1.14.3=*cpu*
  - faiss-cpu=1.14.3

  # --------------------------------------------------------------------------
  # General utilities
  # --------------------------------------------------------------------------
  - certifi
  - setuptools
  - wheel
  - packaging
  - python-dateutil
  - six
  - tqdm
  - typing_extensions
  - python-dotenv

  # --------------------------------------------------------------------------
  # HTTP / Web
  # --------------------------------------------------------------------------
  - requests
  - urllib3
  - idna
  - charset-normalizer
  - beautifulsoup4
  - soupsieve
  - lxml

  # --------------------------------------------------------------------------
  # Data / serialization
  # --------------------------------------------------------------------------
  - pyyaml
  - regex
  - zstandard
  - pymysql
  - protobuf

  # --------------------------------------------------------------------------
  # Git
  # --------------------------------------------------------------------------
  - gitpython
  - gitdb
  - smmap

  # --------------------------------------------------------------------------
  # Text processing
  # --------------------------------------------------------------------------
  - bleach
  - markdownify
  - webencodings
  - text-unidecode
  - python-slugify

  # --------------------------------------------------------------------------
  # Kaggle
  # --------------------------------------------------------------------------
  - kaggle
  - kagglesdk

  # --------------------------------------------------------------------------
  # Neo4j
  # --------------------------------------------------------------------------
  - neo4j-python-driver

  # --------------------------------------------------------------------------
  # FastAPI
  # --------------------------------------------------------------------------
  - fastapi
  - fastapi-cli
  - uvicorn-standard
  - python-multipart

  # --------------------------------------------------------------------------
  # PyPI packages
  # --------------------------------------------------------------------------
  - pip:
      - transformers
      - datasets
      - accelerate
      - sentence-transformers
      - turbovec
      - pennylane
      - pennylane-lightning
      - DrissionPage