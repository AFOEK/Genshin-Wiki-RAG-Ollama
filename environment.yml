name: rag

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip

  # Core scientific stack
  - numpy
  - scipy
  - pandas
  - scikit-learn

  # PyTorch / ML
  - pytorch=2.10
  - transformers
  - datasets
  - accelerate
  - sentence-transformers
  - faiss-cpu
  - lightgbm

  # General utilities
  - certifi
  - setuptools
  - wheel
  - packaging
  - python-dateutil
  - six
  - tqdm
  - typing_extensions
  - python-dotenv

  # HTTP / Web
  - requests
  - urllib3
  - idna
  - charset-normalizer
  - beautifulsoup4
  - soupsieve
  - lxml

  # Data / serialization
  - pyyaml
  - regex
  - zstandard
  - pymysql
  - protobuf

  # Git
  - gitpython
  - gitdb
  - smmap

  # Text processing
  - bleach
  - markdownify
  - webencodings
  - text-unidecode
  - python-slugify

  # Kaggle
  - kaggle
  - kagglesdk

  # Neo4j
  - neo4j-python-driver

  # FastAPI
  - fastapi
  - fastapi-cli
  - uvicorn-standard
  - python-multipart

  # Keep only packages better installed from PyPI
  - pip:
      - turbovec
      - pennylane
      - pennylane-lightning
      - DrissionPage